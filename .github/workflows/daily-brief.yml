name: Daily Briefing

on:
  schedule:
    # 11:00 UTC daily (~7am ET / 6am CT) -- adjust to taste
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch NewsAPI data
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python scripts/fetch_news.py

      - name: Build briefing page
        run: python scripts/build_brief.py

      - name: Commit and push updated data + page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --quiet --cached || git commit -m "Daily briefing update $(date -u +%Y-%m-%d)"
          git push
